[package]
name = "wasm_smoke"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone crate: verification vehicle for llm-harness-loop's wasm32 gate
# (issue #180). Excluded from the parent workspace on purpose — it must build
# standalone, with only the features a senza-wasm consumer would pull.
[workspace]

[dependencies]
llm-harness-loop = { path = "../../crates/llm-harness-loop", features = ["test-utils"] }
llm-harness-types = { path = "../../crates/llm-harness-types" }
tokio-util = "0.7"
futures = "0.3"

uuid = { version = "1", features = ["js"] }

[lib]
crate-type = ["cdylib", "rlib"]
