[workspace]
members = [
    "crates/llm-harness-types",
    "crates/llm-harness-loop",
    "crates/llm-harness-agent",
    "crates/llm-harness-agent-team",
    # runtime
    "crates/llm-harness-platform",
    "crates/llm-harness-subagents",
    "crates/llm-harness-workflow",
    "crates/llm-harness-sandbox",
    "crates/llm-harness-sandbox-remote",
    "crates/llm-harness-sandbox-gateway",
    "crates/llm-harness-agent-control",
    "crates/llm-harness-vm-agent-protocol",
    "crates/llm-harness-vm-agent-transport",
    "crates/llm-harness-vm-agent-env",
    "crates/llm-harness-vm-agent-service",
    "crates/llm-harness-vm-firecracker",
    "crates/llm-harness-mcp",
    "crates/llm-harness-tools",
    "crates/llm-harness-mobile-core",
    "crates/llm-harness-strategy",
    "crates/llm-harness-knowledge",
    "crates/llm-harness-knowledge-local",
    "crates/llm-harness-session-recall",
    "crates/llm-harness-memory",
    "crates/llm-harness-audit-jsonl",
    # pyo3 sdk
    # crates/llm-harness-py — 已迁移到 Senza 仓库 (github.com/oh-my-harness/Senza)
    "crates/llm-harness-trace-otel",
    "crates/session-viewer",
    "crates/llm-harness-live-tests",
    "crates/llm-harness-inspector",
    "crates/llm-harness-agent-team-studio",
    "crates/llm-harness-runtime-app",
    "crates/llm-harness-runtime-app-shell",
    # examples
    # coding-agent is now a separate repo: https://github.com/oh-my-harness/coding-agent.git
    # It depends on this workspace's crates via git rev.
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.5.0"
license = "MIT"

[workspace.dependencies]
# Core (within this workspace)
llm-harness-types  = { path = "crates/llm-harness-types" }
llm-harness-loop   = { path = "crates/llm-harness-loop" }
llm-harness-agent  = { path = "crates/llm-harness-agent" }
# Runtime (within this workspace)
llm-harness-platform = { path = "crates/llm-harness-platform" }
llm-harness-subagents = { path = "crates/llm-harness-subagents" }
llm-harness-workflow = { path = "crates/llm-harness-workflow" }
llm-harness-tools = { path = "crates/llm-harness-tools" }
llm-harness-strategy = { path = "crates/llm-harness-strategy" }
llm-harness-knowledge = { path = "crates/llm-harness-knowledge" }
llm-harness-knowledge-local = { path = "crates/llm-harness-knowledge-local" }
llm-harness-session-recall = { path = "crates/llm-harness-session-recall" }
llm-harness-memory = { path = "crates/llm-harness-memory" }
llm-harness-mcp = { path = "crates/llm-harness-mcp" }
llm-harness-audit-jsonl = { path = "crates/llm-harness-audit-jsonl" }
llm-harness-trace-otel = { path = "crates/llm-harness-trace-otel" }
llm-harness-live-tests = { path = "crates/llm-harness-live-tests" }
llm-harness-inspector = { path = "crates/llm-harness-inspector" }
llm-harness-sandbox = { path = "crates/llm-harness-sandbox" }
llm-harness-sandbox-remote = { path = "crates/llm-harness-sandbox-remote" }
llm-harness-sandbox-gateway = { path = "crates/llm-harness-sandbox-gateway" }
llm-harness-vm-agent-protocol = { path = "crates/llm-harness-vm-agent-protocol" }
llm-harness-vm-agent-transport = { path = "crates/llm-harness-vm-agent-transport" }
llm-harness-vm-agent-env = { path = "crates/llm-harness-vm-agent-env" }
llm-harness-vm-agent-service = { path = "crates/llm-harness-vm-agent-service" }
llm-harness-vm-firecracker = { path = "crates/llm-harness-vm-firecracker" }
llm-harness-agent-team-studio = { path = "crates/llm-harness-agent-team-studio" }
llm-harness-runtime-app = { path = "crates/llm-harness-runtime-app" }
llm-harness-agent-team = { path = "crates/llm-harness-agent-team" }
# API adapter — separate repo
llm_adapter        = { git = "https://github.com/oh-my-harness/llm-api-adapter", rev = "33d34033cbc999667309f533bec198ce411efdc7" }

# Infrastructure
anyhow             = "1"
async-stream       = "0.3"
async-trait        = "0.1"
chrono             = { version = "0.4", features = ["serde"] }
futures            = "0.3"
hmac               = "0.12"
regex              = "1"
glob               = "0.3"
parking_lot        = "0.12"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
sha2               = "0.10"
thiserror          = "2"
tokio              = { version = "1", features = ["sync"] }
tokio-stream       = "0.1"
tokio-util         = { version = "0.7" }
uuid               = { version = "1", features = ["v4", "v7", "js"] }
tempfile           = "3"
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
rusqlite            = { version = "0.40.1", default-features = false, features = ["bundled"] }
base64             = "0.22"
libc               = "0.2"
socket2            = { version = "0.6", features = ["all"] }
encoding_rs         = "0.8"
fastrand          = "2.4"
zeroize            = "1"
tracing            = "0.1"
web-time           = "1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
opentelemetry          = "0.32"
axum = { version = "0.8", features = ["ws"] }
opentelemetry_sdk      = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp     = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
