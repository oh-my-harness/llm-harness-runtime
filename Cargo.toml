[workspace]
members = [
    "crates/llm-harness-types",
    "crates/llm-harness-loop",
    "crates/llm-harness-agent",
    # runtime
    "crates/llm-harness-runtime",
    "crates/llm-harness-runtime-sandbox-os",
    "crates/llm-harness-runtime-sandbox-bwrap",
    "crates/llm-harness-runtime-sandbox-seatbelt",
    "crates/llm-harness-runtime-mcp",
    "crates/llm-harness-runtime-tools",
    "crates/llm-harness-runtime-knowledge",
    "crates/llm-harness-runtime-audit-jsonl",
    # pyo3 sdk
    # crates/llm-harness-py — 已迁移到 Senza 仓库 (github.com/oh-my-harness/Senza)
    "crates/llm-harness-runtime-trace-otel",
    "crates/session-viewer",
    # examples
    # coding-agent is now a separate repo: https://github.com/oh-my-harness/coding-agent.git
    # It depends on this workspace's crates via git rev.
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.3.0"
license = "MIT"

[workspace.dependencies]
# Core (within this workspace)
llm-harness-types  = { path = "crates/llm-harness-types" }
llm-harness-loop   = { path = "crates/llm-harness-loop" }
llm-harness-agent  = { path = "crates/llm-harness-agent" }
# Runtime (within this workspace)
llm-harness-runtime = { path = "crates/llm-harness-runtime" }
llm-harness-runtime-tools = { path = "crates/llm-harness-runtime-tools" }
llm-harness-runtime-knowledge = { path = "crates/llm-harness-runtime-knowledge" }

# API adapter — separate repo
llm_adapter        = { git = "https://github.com/oh-my-harness/llm-api-adapter", rev = "16a22ad284b8deb8c3a77664a0876f565f4a6eb9" }

# Infrastructure
anyhow             = "1"
async-stream       = "0.3"
async-trait        = "0.1"
chrono             = { version = "0.4", features = ["serde"] }
futures            = "0.3"
regex              = "1"
parking_lot        = "0.12"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
sha2               = "0.10"
thiserror          = "2"
tokio              = { version = "1", features = ["sync"] }
tokio-stream       = "0.1"
tokio-util         = { version = "0.7" }
uuid               = { version = "1", features = ["v4", "v7"] }
tempfile           = "3"
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64             = "0.22"
zeroize            = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
