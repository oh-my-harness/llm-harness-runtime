[workspace]
members = [
    "crates/llm-harness-types",
    "crates/llm-harness-loop",
    "crates/llm-harness-agent",
    # runtime
    "crates/llm-harness-platform",
    "crates/llm-harness-runtime",
    "crates/llm-harness-sandbox",
    "crates/llm-harness-mcp",
    "crates/llm-harness-tools",
    "crates/llm-harness-strategy",
    "crates/llm-harness-knowledge",
    "crates/llm-harness-knowledge-local",
    "crates/llm-harness-session-recall",
    "crates/llm-harness-memory",
    "crates/llm-harness-audit-jsonl",
    # pyo3 sdk
    # crates/llm-harness-py — 已迁移到 Senza 仓库 (github.com/oh-my-harness/Senza)
    "crates/llm-harness-trace-otel",
    "crates/session-viewer",
    "crates/llm-harness-live-tests",
    # examples
    # coding-agent is now a separate repo: https://github.com/oh-my-harness/coding-agent.git
    # It depends on this workspace's crates via git rev.
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.5.0"
license = "MIT"

[workspace.dependencies]
# Core (within this workspace)
llm-harness-types  = { path = "crates/llm-harness-types" }
llm-harness-loop   = { path = "crates/llm-harness-loop" }
llm-harness-agent  = { path = "crates/llm-harness-agent" }
# Runtime (within this workspace)
llm-harness-platform = { path = "crates/llm-harness-platform" }
llm-harness-runtime = { path = "crates/llm-harness-runtime" }
llm-harness-tools = { path = "crates/llm-harness-tools" }
llm-harness-strategy = { path = "crates/llm-harness-strategy" }
llm-harness-knowledge = { path = "crates/llm-harness-knowledge" }
llm-harness-knowledge-local = { path = "crates/llm-harness-knowledge-local" }
llm-harness-session-recall = { path = "crates/llm-harness-session-recall" }
llm-harness-memory = { path = "crates/llm-harness-memory" }
llm-harness-mcp = { path = "crates/llm-harness-mcp" }
llm-harness-audit-jsonl = { path = "crates/llm-harness-audit-jsonl" }
llm-harness-trace-otel = { path = "crates/llm-harness-trace-otel" }
llm-harness-live-tests = { path = "crates/llm-harness-live-tests" }
llm-harness-sandbox = { path = "crates/llm-harness-sandbox" }
# API adapter — separate repo
llm_adapter        = { git = "https://github.com/oh-my-harness/llm-api-adapter", rev = "193117cbb8398aadeca74a925cfd699617f8c861" }

# Infrastructure
anyhow             = "1"
async-stream       = "0.3"
async-trait        = "0.1"
chrono             = { version = "0.4", features = ["serde"] }
futures            = "0.3"
hmac               = "0.12"
regex              = "1"
glob               = "0.3"
parking_lot        = "0.12"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
sha2               = "0.10"
thiserror          = "2"
tokio              = { version = "1", features = ["sync"] }
tokio-stream       = "0.1"
tokio-util         = { version = "0.7" }
uuid               = { version = "1", features = ["v4", "v7"] }
tempfile           = "3"
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite            = { version = "0.40.1", default-features = false }
base64             = "0.22"
fastrand          = "2.4"
zeroize            = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
opentelemetry          = "0.32"
opentelemetry_sdk      = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp     = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
