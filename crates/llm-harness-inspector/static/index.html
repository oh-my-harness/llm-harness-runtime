<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Harness Inspector</title>
<style>
  :root {
    --bg: #1a1a2e;
    --bg-panel: #16213e;
    --bg-card: #0f3460;
    --bg-input: #1a1a2e;
    --text: #e0e0e0;
    --text-dim: #8a8a9a;
    --accent: #e94560;
    --border: #2a2a4a;
    --green: #00b894;
    --orange: #fdcb6e;
    --purple: #a29bfe;
    --gray: #636e72;
    --red: #e74c3c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 20px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    white-space: nowrap;
  }
  #ws-status {
    font-size: 12px;
    color: var(--text-dim);
  }
  #ws-status.connected { color: var(--green); }
  #ws-status.connecting { color: var(--orange); }
  #ws-status.disconnected { color: var(--red); }
  /* ── Layout ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  /* ── Sidebar ── */
  #sidebar {
    width: 320px;
    min-width: 280px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
    flex-shrink: 0;
  }
  .panel-section {
    margin-bottom: 20px;
  }
  .panel-section h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-dim);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .config-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .config-row .label { color: var(--text-dim); }
  .config-row .value { text-align: right; word-break: break-all; }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge-Idle { background: var(--gray); color: #fff; }
  .badge-Turning { background: var(--orange); color: #000; }
  .badge-Compacting { background: var(--purple); color: #000; }
  .badge-Branching { background: var(--green); color: #000; }
  .badge-Unknown { background: var(--red); color: #fff; }
  .tool-tag {
    display: inline-block;
    background: var(--bg-card);
    color: var(--text);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    margin: 2px;
  }
  /* ── Event stream ── */
  #stream-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  #stream {
    max-width: 900px;
    margin: 0 auto;
  }
  .msg {
    margin-bottom: 12px;
    padding: 12px 16px;
    border-radius: 8px;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg-assistant {
    background: var(--bg-card);
    border-left: 3px solid var(--accent);
  }
  .msg-system {
    background: rgba(255,255,255,0.03);
    border-left: 3px solid var(--text-dim);
    color: var(--text-dim);
    font-size: 13px;
    font-style: italic;
  }
  .msg-error {
    background: rgba(231,76,60,0.15);
    border-left: 3px solid var(--red);
    color: #f0a0a0;
  }
  .msg-retry {
    background: rgba(253,203,110,0.1);
    border-left: 3px solid var(--orange);
    color: #e0c080;
    font-size: 13px;
  }
  .msg-meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .tool-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    margin: 8px 0;
  }
  .tool-card .tool-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    color: var(--accent);
    font-size: 13px;
  }
  .tool-card .tool-args {
    margin-top: 6px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px;
    color: var(--text-dim);
    white-space: pre-wrap;
    word-break: break-all;
  }
  .tool-card .tool-result {
    margin-top: 6px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .tool-card .tool-result.error { color: #f0a0a0; }
  .tool-card .tool-result.ok { color: var(--green); }
  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>LLM Harness Inspector</h1>
    <span id="phase-badge" class="badge badge-Idle">Idle</span>
    <span id="ws-status" class="disconnected">disconnected</span>
  </header>
  <div id="main">
    <aside id="sidebar">
      <div class="panel-section">
        <h2>Configuration</h2>
        <div id="config-panel"><span class="value" style="color:var(--text-dim)">Loading...</span></div>
      </div>
      <div class="panel-section">
        <h2>Token Usage</h2>
        <div id="usage-panel"><span class="value" style="color:var(--text-dim)">—</span></div>
      </div>
    </aside>
    <div id="stream-container">
      <div id="stream"></div>
    </div>
  </div>
</div>
<script>
(function() {
  "use strict";

  // ── State ──
  var ws = null;
  var reconnectDelay = 2000;
  var reconnectTimer = null;
  var currentMessageEl = null;   // active assistant message bubble
  var currentMessageId = null;
  var toolCards = {};             // tool_use_id → tool card element

  // ── DOM helpers ──
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function esc(s) {
    if (s == null) return "";
    var d = document.createElement("div");
    d.textContent = String(s);
    return d.innerHTML;
  }

  // ── Phase badge ──
  function setPhase(phase) {
    var badge = $("phase-badge");
    badge.textContent = phase;
    badge.className = "badge badge-" + phase;
  }

  // ── Config panel ──
  function renderConfig(cfg) {
    var panel = $("config-panel");
    panel.innerHTML = "";
    var state = cfg.state || cfg;
    var rows = [
      ["Model", state.model],
      ["Phase", state.phase],
      ["Thinking", state.thinking_level],
      ["Temperature", state.temperature != null ? String(state.temperature) : "—"],
      ["Final Answer", state.final_answer_mode],
      ["System Prompt", state.system_prompt ? (state.system_prompt.length > 60 ? state.system_prompt.slice(0, 60) + "…" : state.system_prompt) : "—"],
    ];
    if (cfg.session_id) rows.unshift(["Session", cfg.session_id]);
    rows.forEach(function(r) {
      panel.appendChild(el("div", "config-row"));
      var row = panel.lastChild;
      row.appendChild(el("span", "label", r[0]));
      row.appendChild(el("span", "value", r[1]));
    });
    // Tools
    var tools = state.tools || [];
    if (tools.length > 0) {
      var h = el("div", "config-row");
      h.appendChild(el("span", "label", "Tools"));
      panel.appendChild(h);
      var tags = el("div", null);
      tools.forEach(function(t) {
        tags.appendChild(el("span", "tool-tag", t));
      });
      panel.appendChild(tags);
    }
  }

  // ── Usage panel ──
  function renderUsage(usage) {
    var panel = $("usage-panel");
    if (!usage) { panel.innerHTML = '<span class="value" style="color:var(--text-dim)">—</span>'; return; }
    panel.innerHTML = "";
    var rows = [
      ["Input", usage.total_input_tokens],
      ["Output", usage.total_output_tokens],
      ["Cache Read", usage.total_cache_read_tokens],
      ["Cache Write", usage.total_cache_write_tokens],
      ["Reasoning", usage.total_reasoning_tokens],
      ["Cost", usage.total_cost != null ? "$" + Number(usage.total_cost).toFixed(4) : "—"],
    ];
    rows.forEach(function(r) {
      var row = el("div", "config-row");
      row.appendChild(el("span", "label", r[0]));
      row.appendChild(el("span", "value", String(r[1])));
      panel.appendChild(row);
    });
  }

  // ── Event stream helpers ──
  function appendSystem(text) {
    var stream = $("stream");
    var msg = el("div", "msg msg-system", text);
    stream.appendChild(msg);
    stream.scrollTop = stream.scrollHeight;
  }

  function appendError(text) {
    var stream = $("stream");
    var msg = el("div", "msg msg-error", "⚠ " + text);
    stream.appendChild(msg);
    stream.scrollTop = stream.scrollHeight;
  }

  function appendRetry(data) {
    var stream = $("stream");
    var text = "Retry " + data.attempt + "/" + data.max_retries + " in " + data.delay_ms + "ms — " + data.error;
    var msg = el("div", "msg msg-retry", text);
    stream.appendChild(msg);
    stream.scrollTop = stream.scrollHeight;
  }

  var isStreaming = false; // true when receiving TextDelta for current message

  function startMessage(messageId) {
    closeMessage();
    var stream = $("stream");
    var msg = el("div", "msg msg-assistant");
    var meta = el("div", "msg-meta", "assistant" + (messageId ? "  ·  " + messageId : ""));
    msg.appendChild(meta);
    var body = el("div", "msg-body");
    msg.appendChild(body);
    stream.appendChild(msg);
    currentMessageEl = body;
    currentMessageId = messageId;
    isStreaming = false;
    stream.scrollTop = stream.scrollHeight;
  }

  function appendText(text) {
    if (!currentMessageEl) startMessage(null);
    isStreaming = true;
    currentMessageEl.appendChild(document.createTextNode(text));
    var stream = $("stream");
    stream.scrollTop = stream.scrollHeight;
  }

  function closeMessage() {
    currentMessageEl = null;
    currentMessageId = null;
    isStreaming = false;
  }

  function createToolCard(data) {
    var stream = $("stream");
    var card = el("div", "tool-card");
    var header = el("div", "tool-header", "🔧 " + (data.tool_name || data.name || "tool"));
    card.appendChild(header);
    if (data.args != null) {
      var argsEl = el("div", "tool-args", "args: " + (typeof data.args === "string" ? data.args : JSON.stringify(data.args, null, 2)));
      card.appendChild(argsEl);
    }
    stream.appendChild(card);
    if (data.tool_use_id) toolCards[data.tool_use_id] = card;
    stream.scrollTop = stream.scrollHeight;
  }

  function appendToolResult(toolUseId, result) {
    var card = toolCards[toolUseId];
    if (!card) return;
    // SerializableToolOutcome is an untagged enum: Ok(SerializableToolResult)
    // has `model_content`, Err(SerializableToolFailure) has `code`/`model_message`.
    var isError = result && (result.code != null || result.model_message != null);
    var details = result && result.details;
    var text = typeof details === "string" ? details : JSON.stringify(details, null, 2);
    var resEl = el("div", "tool-result " + (isError ? "error" : "ok"), (isError ? "✗ " : "✓ ") + text);
    card.appendChild(resEl);
    var stream = $("stream");
    stream.scrollTop = stream.scrollHeight;
  }

  // ── WS message handling ──
  function handleMessage(msg) {
    var type = msg.type;
    var innerType = msg.inner_type;
    var data = msg.data || {};

    switch (type) {
      case "Snapshot":
        if (data.state) {
          renderConfig({ state: data.state, session_id: null });
          setPhase(data.state.phase || "Idle");
        }
        if (data.usage) renderUsage(data.usage);
        break;

      case "PhaseChange":
        if (data.to) setPhase(data.to);
        if (data.from && data.to) {
          appendSystem("Phase: " + data.from + " → " + data.to);
        }
        break;

      case "Agent":
        handleAgentEvent(innerType, data.inner || {});
        break;

      case "CompactionStart":
        appendSystem("Compaction started (est. " + (data.estimated_tokens || 0) + " tokens)");
        break;
      case "CompactionEnd":
        if (data.error) {
          appendSystem("Compaction failed: " + data.error);
        } else {
          appendSystem("Compaction complete");
        }
        break;

      case "Settled":
        appendSystem("Agent settled");
        break;
      case "Aborted":
        appendSystem("Agent aborted");
        break;

      case "ModelUpdate":
        appendSystem("Model: " + (data.from || "?") + " → " + (data.to || "?"));
        break;
      case "ThinkingLevelUpdate":
        appendSystem("Thinking: " + (data.from || "?") + " → " + (data.to || "?"));
        break;
      case "ToolsUpdate":
        var added = (data.added || []).join(", ");
        var removed = (data.removed || []).join(", ");
        appendSystem("Tools updated: +" + (added || "∅") + "  -" + (removed || "∅"));
        break;

      default:
        // Other events (QueueUpdate, SavePoint, Branch*, etc.) — show as system
        appendSystem(type + ": " + JSON.stringify(data));
        break;
    }
  }

  function handleAgentEvent(innerType, data) {
    switch (innerType) {
      case "TextDelta":
        appendText(data.text || "");
        break;

      case "ThinkingDelta":
        // Show thinking in a dimmed style within the current message
        if (!currentMessageEl) startMessage(null);
        var think = el("span", null);
        think.style.color = "var(--text-dim)";
        think.style.fontStyle = "italic";
        think.textContent = data.thinking || "";
        currentMessageEl.appendChild(think);
        var stream = $("stream");
        stream.scrollTop = stream.scrollHeight;
        break;

      case "MessageStart":
        startMessage(data.message_id || null);
        break;

      case "MessageEnd":
        // Text already rendered via TextDelta. Trust the stream — don't re-render.
        closeMessage();
        break;

      case "MessageUpdate":
        // Full snapshot — redundant with TextDelta/ThinkingDelta incremental stream.
        // Skip entirely to avoid flicker (clear+re-render on every token).
        break;

      case "ToolCallStart":
        createToolCard({
          tool_use_id: data.tool_use_id,
          tool_name: data.name || data.tool_name,
          args: null,
        });
        break;

      case "ToolCallArgsDelta":
        var card = toolCards[data.tool_use_id];
        if (card) {
          var argsEl = card.querySelector(".tool-args");
          if (argsEl) {
            argsEl.textContent += (data.partial_input || "");
          }
        }
        break;

      case "ToolCallEnd":
        var card2 = toolCards[data.tool_use_id];
        if (card2) {
          var argsEl2 = card2.querySelector(".tool-args");
          if (argsEl2) {
            argsEl2.textContent = "args: " + (typeof data.args === "string" ? data.args : JSON.stringify(data.args, null, 2));
          }
        }
        break;

      case "ToolExecutionStart":
        createToolCard({
          tool_use_id: data.tool_use_id,
          tool_name: data.tool_name,
          args: data.args,
        });
        break;

      case "ToolExecutionUpdate":
        // Tool progress — append to tool card
        var card3 = toolCards[data.tool_use_id];
        if (card3 && data.partial) {
          var progEl = el("div", "tool-args", "progress: " + JSON.stringify(data.partial.details || {}));
          card3.appendChild(progEl);
          var stream3 = $("stream");
          stream3.scrollTop = stream3.scrollHeight;
        }
        break;

      case "ToolExecutionEnd":
        appendToolResult(data.tool_use_id, data.result);
        break;

      case "Error":
        appendError(data.error || data.message || "Unknown error");
        break;

      case "RetryAttempt":
        appendRetry(data);
        break;

      case "AgentStart":
        appendSystem("Agent started");
        break;
      case "AgentEnd":
        appendSystem("Agent ended (" + (data.new_messages ? data.new_messages.length : 0) + " new messages)");
        break;
      case "TurnStart":
        appendSystem("Turn " + (data.index != null ? data.index : "?") + " started");
        break;
      case "TurnEnd":
        appendSystem("Turn " + (data.index != null ? data.index : "?") + " ended");
        break;

      default:
        appendSystem("Agent." + (innerType || "?") + ": " + JSON.stringify(data));
        break;
    }
  }

  // ── WebSocket connection ──
  function connectWS() {
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    var url = proto + "//" + location.host + "/api/events";
    setStatus("connecting");
    ws = new WebSocket(url);

    ws.onopen = function() {
      setStatus("connected");
    };

    ws.onmessage = function(event) {
      try {
        var msg = JSON.parse(event.data);
        handleMessage(msg);
      } catch (e) {
        // Ignore malformed messages
      }
    };

    ws.onclose = function() {
      setStatus("disconnected");
      ws = null;
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connectWS, reconnectDelay);
    };

    ws.onerror = function() {
      // onclose will handle reconnect
    };
  }

  function setStatus(status) {
    var s = $("ws-status");
    s.textContent = status;
    s.className = status;
  }

  // ── REST: fetch config on load ──
  function fetchConfig() {
    fetch("/api/agent/config")
      .then(function(r) { return r.json(); })
      .then(function(cfg) {
        renderConfig(cfg);
        if (cfg.phase) setPhase(cfg.phase);
        if (cfg.budget) renderUsage(cfg.budget);
      })
      .catch(function() {
        $("config-panel").innerHTML = '<span class="value" style="color:var(--text-dim)">Failed to load config</span>';
      });
  }

  // ── Init ──
  fetchConfig();
  connectWS();
})();
</script>
</body>
</html>
