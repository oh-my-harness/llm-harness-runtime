[package]
name    = "llm-harness-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
llm-harness-platform.workspace = true
llm-harness-types.workspace   = true
anyhow.workspace              = true
chrono.workspace              = true
futures.workspace             = true
serde_json.workspace          = true
uuid.workspace                = true
tempfile.workspace            = true
tokio      = { workspace = true, features = ["process", "fs", "io-util", "time"] }
tokio-util.workspace          = true
cap-std = { version = "3", optional = true }

[features]
default = ["os", "bwrap", "seatbelt"]
os = []
bwrap = ["os", "dep:cap-std"]
seatbelt = ["os"]
# API boundary compile-probe tests are off by default — they spawn ~20
# `cargo check` subprocesses and add ~17s to the test suite.  Enable with
# `cargo test -p llm-harness-sandbox --features api-boundary-tests`.
api-boundary-tests = []

[dev-dependencies]
tokio     = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util = { workspace = true }
tempfile.workspace = true
