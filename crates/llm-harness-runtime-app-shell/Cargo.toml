[package]
name = "llm-harness-runtime-app-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "llm-harness-app-shell"

[features]
default = ["dev-core-bin"]
dev-core-bin = [
    "dep:llm-harness-agent-team-studio",
    "dep:llm-harness-runtime-app",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[lib]
name = "llm_harness_runtime_app_shell"
path = "src/lib.rs"

[[bin]]
name = "llm-harness-app-shell"
path = "src/main.rs"

[[bin]]
name = "llm-harness-app"
path = "../llm-harness-runtime-app/src/main.rs"
required-features = ["dev-core-bin"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
llm-harness-agent-team-studio = { workspace = true, optional = true }
llm-harness-runtime-app = { workspace = true, optional = true }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = [] }
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
