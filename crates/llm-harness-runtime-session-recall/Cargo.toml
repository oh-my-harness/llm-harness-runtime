[package]
name = "llm-harness-runtime-session-recall"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
sqlite = ["dep:rusqlite", "tokio/rt"]
sqlite-bundled = ["sqlite", "rusqlite/bundled"]

[dependencies]
llm-harness-types.workspace = true
llm-harness-agent.workspace = true
llm-harness-runtime-knowledge.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
llm-harness-runtime-knowledge = { workspace = true, features = ["test-utils"] }
llm-harness-loop = { workspace = true, features = ["test-utils"] }
llm_adapter.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "sqlite_recall"
harness = false
required-features = ["sqlite-bundled"]
