[package]
name = "llm-harness-vm-agent-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "llm-harness-vm-agent"
path = "src/bin/vm_agent.rs"

[dependencies]
async-trait.workspace = true
base64.workspace = true
llm-harness-vm-agent-protocol.workspace = true
llm-harness-vm-agent-transport.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
encoding_rs.workspace = true
libc.workspace = true
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }
