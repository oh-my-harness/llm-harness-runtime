[package]
name = "llm-harness-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "llm_harness_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["macros", "py-clone"] }
llm-harness-types.workspace = true
llm-harness-loop = { workspace = true }
llm-harness-agent.workspace = true
llm-harness-runtime.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
futures.workspace = true
tokio-util.workspace = true
base64.workspace = true

[dev-dependencies]
pyo3 = { version = "0.29", features = ["macros", "py-clone", "auto-initialize"] }
tempfile.workspace = true

[features]
# extension-module 仅在构建 cdylib 时启用；cargo test 默认不启用，
# 以便 Rust 集成测试能链接到 libpython（auto-initialize 会初始化解释器）。
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
# test-utils 启用 drive() 测试方法、MockLlmClient Agent 等仅供测试/验证的功能。
# 生产构建（maturin develop --release / build）不应启用此 feature。
test-utils = ["llm-harness-loop/test-utils"]

[build-dependencies]
pyo3-build-config = "0.29"
