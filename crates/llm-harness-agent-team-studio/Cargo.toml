[package]
name = "llm-harness-agent-team-studio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
llm-harness-agent.workspace = true
llm-harness-agent-team.workspace = true
llm-harness-types.workspace = true
llm-harness-tools.workspace = true
llm-harness-loop.workspace = true
llm-harness-mcp.workspace = true
llm-harness-sandbox.workspace = true
llm-harness-platform.workspace = true
llm-harness-inspector = { workspace = true, features = ["inspect"] }
axum.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal"] }
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tracing.workspace = true
chrono.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["serde"] }
sha2.workspace = true

[dev-dependencies]
llm-harness-strategy.workspace = true
tempfile.workspace = true
tokio-util.workspace = true
llm-harness-loop = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
