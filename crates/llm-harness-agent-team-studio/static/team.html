<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Coding Team</title>
<style>
  :root { --bg: #f5f5f7; --panel: #fff; --border: #d1d1d6; --text: #1d1d1f; --dim: #86868b; --accent: #0071e3; --ok: #34c759; --warn: #ff9f0a; --err: #ff3b30; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1d1f; --panel: #2d2d2f; --border: #3d3d3f; --text: #f5f5f7; --dim: #aeaeb2; --accent: #0a84ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; }
  aside { width: 240px; border-right: 1px solid var(--border); background: var(--panel); padding: 1rem; display: flex; flex-direction: column; gap: .5rem; overflow-y: auto; }
  aside h2 { font-size: .8rem; color: var(--dim); margin: 0 0 .5rem; text-transform: uppercase; letter-spacing: .05em; }
  .project { padding: .5rem .75rem; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .project:hover { border-color: var(--accent); }
  .project.selected { background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: var(--accent); }
  .project .repo { font-size: .7rem; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project .restart-btn { margin-top: .35rem; margin-right: .35rem; padding: .15rem .55rem; font-size: .68rem; background: var(--accent); }
  form { margin-top: auto; display: flex; flex-direction: column; gap: .4rem; border-top: 1px solid var(--border); padding-top: .75rem; }
  input { padding: .4rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: .8rem; }
  button { padding: .4rem .8rem; border: none; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; font-size: .8rem; }
  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  nav { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--panel); }
  nav a, nav button { background: none; border: none; color: var(--dim); padding: .6rem 1rem; font-size: .85rem; cursor: pointer; text-decoration: none; }
  nav .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
  section { flex: 1; overflow-y: auto; padding: 1rem; display: none; }
  section.active { display: block; }
  /* chat */
  #op-stream { display: flex; flex-direction: column; gap: .35rem; max-height: 260px; overflow-y: auto; }
  #op-stream .item .meta { font-size: .72rem; color: var(--dim); }
  #op-stream .item .body { font-size: .78rem; word-break: break-all; }
  .msg { max-width: 70%; padding: .5rem .75rem; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); font-size: .85rem; white-space: pre-wrap; word-break: break-word; }
  .msg .meta { font-size: .65rem; color: var(--dim); margin-bottom: .2rem; }
  .msg.operator { align-self: flex-end; background: color-mix(in srgb, var(--accent) 15%, var(--panel)); }
  .toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .toggle label { padding: .35rem .7rem; font-size: .78rem; cursor: pointer; color: var(--dim); }
  .toggle input { display: none; }
  .toggle input:checked + span { color: var(--accent); font-weight: 600; }
  /* issues */
  .issue-group h3 { font-size: .75rem; color: var(--dim); margin: 1rem 0 .4rem; text-transform: uppercase; }
  /* settings */
  .project .del-btn { margin-top: .35rem; padding: .15rem .55rem; font-size: .68rem; background: var(--err); }
  .settings-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; max-width: 560px; }
  .settings-card h3 { font-size: .9rem; margin: 0 0 .6rem; }
  .settings-card .row { display: flex; align-items: center; gap: .6rem; margin-bottom: .5rem; }
  .settings-card .row label { width: 100px; font-size: .8rem; color: var(--dim); flex-shrink: 0; }
  .settings-card .row input { flex: 1; }
  .hint { font-size: .72rem; color: var(--dim); margin: .4rem 0 0; }
  section#tab-settings { overflow-y: auto; }
  .issue { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: .6rem .8rem; margin-bottom: .4rem; display: flex; justify-content: space-between; align-items: center; gap: .75rem; }
  .issue .title { font-size: .85rem; }
  .issue .meta { font-size: .68rem; color: var(--dim); }
  .issue .actions { display: flex; gap: .4rem; }
  .issue .actions .reject { background: var(--err); }
  .empty { color: var(--dim); font-size: .85rem; }
  .row2 { display: flex; gap: .5rem; }
  .row2 button { flex: 1; }
  #browse-btn { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  /* dir picker modal */
  #dir-modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 100; }
  #dir-modal.open { display: flex; }
  .dir-dialog { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; width: 480px; max-width: 90vw; max-height: 70vh; display: flex; flex-direction: column; padding: 1rem; }
  .dir-dialog h3 { margin: 0 0 .5rem; font-size: .9rem; }
  .dir-crumbs { font-size: .72rem; color: var(--dim); margin-bottom: .5rem; word-break: break-all; min-height: 1em; }
  .dir-list { flex: 1; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); min-height: 200px; }
  .dir-item { padding: .4rem .75rem; font-size: .82rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .dir-item:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .dir-item .repo-tag { font-size: .65rem; color: var(--ok); font-weight: 600; }
  .dir-actions { display: flex; justify-content: space-between; margin-top: .75rem; gap: .5rem; }
  .dir-actions .cancel { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  .grant-row { display: flex; gap: .4rem; margin-bottom: .5rem; }
  .grant-row input { flex: 1; }
  .grant-row button, .grant-remove { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  .grant-list { max-height: 84px; overflow-y: auto; margin-bottom: .5rem; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
  .grant-item { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .3rem .5rem; font-size: .72rem; }
  .grant-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grant-remove { font-size: .65rem; padding: .1rem .35rem; }
  /* pulse — per-agent cards */
  .agent-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: .6rem .9rem; margin-bottom: .5rem; display: flex; align-items: center; gap: .7rem; }
  .agent-card.busy { border-color: var(--warn); }
  .agent-card .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
  .agent-card .dot.idle { background: var(--ok); }
  .agent-card .dot.busy { background: var(--warn); animation: pulse-dot 1.2s infinite; }
  .agent-card .dot.stopped, .agent-card .dot.error { background: var(--err); }
  @keyframes pulse-dot { 50% { opacity: .35; } }
  .agent-card .who { min-width: 130px; }
  .agent-card .who .name { font-size: .85rem; font-weight: 600; }
  .agent-card .who .meta { font-size: .66rem; color: var(--dim); }
  .agent-card .activity { flex: 1; font-size: .78rem; color: var(--text); min-width: 0; }
  .agent-card .activity .task { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent-card .activity .tools { color: var(--dim); font-size: .68rem; }
  .agent-card .ctrl { display: flex; gap: .4rem; flex-shrink: 0; }
  .agent-card .ctrl button { padding: .25rem .6rem; font-size: .7rem; }
  .agent-card .ctrl .stop { background: var(--err); }
  .pulse-card { flex: 1; min-width: 260px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: .8rem 1rem; }
  .pulse-card h3 { font-size: .8rem; margin: 0 0 .5rem; color: var(--dim); }
  .pulse-card .item { font-size: .8rem; padding: .3rem 0; border-bottom: 1px solid var(--border); }
  .pulse-card .item:last-child { border-bottom: none; }
  .pulse-card .meta { color: var(--dim); font-size: .68rem; }

  #error-banner { display: none; background: rgba(220,80,80,.12); border-bottom: 1px solid var(--err); color: var(--err); padding: .45rem 1rem; font-size: .82rem; }
  #recovery-banner { display: none; background: rgba(255,159,10,.12); border-bottom: 1px solid var(--warn); color: var(--warn); padding: .45rem 1rem; font-size: .82rem; }
  #recovery-banner ul { margin: .25rem 0 0; padding-left: 1.2rem; }
  .msg.sys-error { border-left: 3px solid var(--err); background: rgba(220,80,80,.08); }
  .member-card .err-line { color: var(--err); font-size: .74rem; margin-top: .2rem; word-break: break-all; }
  /* ── studio three-column workspace ── */
  .studio-grid { display: grid; grid-template-columns: 300px 1fr 340px; gap: .75rem; flex: 1; min-height: 0; }
  .studio-col { overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: .6rem; }
  .member-card { border: 1px solid var(--border); border-radius: 6px; padding: .5rem .6rem; margin-bottom: .45rem; cursor: pointer; }
  .member-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .member-card .name { font-weight: 600; font-size: .85rem; }
  .member-card .meta { color: var(--dim); font-size: .75rem; }
  .member-card .ctrl { display: flex; gap: .35rem; margin-top: .35rem; }
  #col-history .h-line { border-bottom: 1px dashed var(--border); padding: .3rem 0; font-size: .8rem; }
  #col-history .h-line.user { color: var(--accent); }
  #col-history .h-line.tool { color: var(--dim); font-size: .72rem; }
  #col-config .row { display: flex; gap: .4rem; align-items: center; margin-bottom: .5rem; }
  #col-config .row label { width: 72px; color: var(--dim); font-size: .78rem; }
  #col-config input, #col-config textarea, #col-config select { flex: 1; font-size: .8rem; }
  #col-config textarea { min-height: 90px; font-family: inherit; }
  .toolkit-checks { display: flex; flex-wrap: wrap; gap: .5rem .8rem; }
  .toolkit-checks label { width: auto; color: var(--fg); font-size: .78rem; }
  #set-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60; align-items: center; justify-content: center; }
  #set-modal.open { display: flex; }
  .set-dialog { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.2rem; width: 420px; }
  .set-dialog h3 { margin-top: 0; }
  .set-dialog .row { display: flex; gap: .5rem; align-items: center; margin-bottom: .55rem; }
  .set-dialog .row label { width: 110px; color: var(--dim); font-size: .8rem; }
  .set-dialog input { flex: 1; }
  @media (max-width: 980px) { .studio-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<aside>
  <h2>Projects</h2>
  <div id="project-list"></div>
  <form id="register-form">
    <input id="reg-id" placeholder="项目 id" required>
    <input id="reg-path" placeholder="仓库绝对路径" required>
    <div class="row2">
      <button type="button" id="browse-btn">浏览…</button>
      <button type="submit">注册项目</button>
    </div>
  </form>
</aside>
<main>
  <nav>
    <button class="tab active" data-tab="pulse">动态</button>
    <button class="tab" data-tab="issues">Issues</button>
    <button id="global-settings" title="全局设置">⚙</button>
  </nav>
  <div id="error-banner" style="display:none"></div>
  <div id="recovery-banner" style="display:none"></div>
  <section id="tab-pulse" class="active">
    <div class="studio-grid">
      <div id="col-members" class="studio-col"></div>
      <div id="col-history" class="studio-col"></div>
      <div id="col-config" class="studio-col"></div>
    </div>
    <div class="pulse-row">
      <div class="pulse-card">
        <h3>Operator 消息流</h3>
        <div id="op-stream"><p class="empty">成员发给操作员的消息实时出现在这里。</p></div>
        <div id="pulse-pending"></div>
      </div>
      <div class="pulse-card">
        <h3>Issue 概况</h3>
        <div id="pulse-issues"><p class="empty">—</p></div>
        <div id="pulse-timers"><p class="empty">—</p></div>
      </div>
    </div>
  </section>
  <!-- 全局设置模态框（⚙） -->
  <div id="set-modal">
    <div class="set-dialog">
      <h3>全局设置</h3>
      <div class="row"><label>API Key</label><input id="g-apikey" type="password" placeholder="OPENAI_API_KEY（OpenAI 兼容端点）"></div>
      <div class="row"><label>强</label><input id="g-model-strong" placeholder="strong model id"></div>
      <div class="row"><label>主</label><input id="g-model-main" placeholder="main model id"></div>
      <div class="row"><label>省</label><input id="g-model-cheap" placeholder="cheap model id"></div>
      <div class="row"><label>Base URL</label><input id="g-base-url" placeholder="留空 = 官方 OpenAI"></div>
      <div class="row"><label>巡检间隔（秒）</label><input id="g-scout-interval" type="number" min="0"></div>
      <p class="hint">模型变更对新注册的团队生效。</p>
      <div class="dir-actions">
        <button class="cancel" id="g-cancel">取消</button>
        <button id="g-save">保存</button>
      </div>
    </div>
  </div>
  <section id="tab-issues">
    <div id="issue-list"><p class="empty">选择项目后加载。</p></div>
  </section>
</main>
<div id="dir-modal">
  <div class="dir-dialog">
    <h3>选择仓库目录</h3>
    <div class="grant-row">
      <input id="grant-path" placeholder="输入可授权的工作区绝对路径">
      <button id="grant-add">授权</button>
    </div>
    <div class="grant-list" id="grant-list"></div>
    <div class="dir-crumbs" id="dir-crumbs"></div>
    <div class="dir-list" id="dir-list"></div>
    <div class="dir-actions">
      <button class="cancel" id="dir-cancel">取消</button>
      <button id="dir-up">上一级</button>
      <button id="dir-select">选择当前目录</button>
    </div>
  </div>
</div>
<script>
let projects = [];
let current = null;
const $ = (id) => document.getElementById(id);
const authToken = (() => {
  if (!location.hash.includes('token=')) return sessionStorage.getItem('studio-token') || '';
  const token = new URLSearchParams(location.hash.slice(1)).get('token') || '';
  sessionStorage.setItem('studio-token', token);
  history.replaceState(null, '', location.pathname + location.search);
  return token;
})();

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ Authorization: `Bearer ${authToken}` }, opts.headers || {});
  const resp = await fetch(path, opts);
  const json = await resp.json().catch(() => ({}));
  return { status: resp.status, json };
}

function renderProjects() {
  const list = $('project-list');
  list.textContent = '';
  if (!projects.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = '暂无项目';
    list.appendChild(p);
    return;
  }
  for (const pr of projects) {
    const div = document.createElement('div');
    div.className = 'project' + (pr.id === current ? ' selected' : '');
    const name = document.createElement('div');
    name.textContent = pr.id;
    div.appendChild(name);
    const repo = document.createElement('div');
    repo.className = 'repo';
    repo.textContent = pr.repo_path;
    repo.title = pr.repo_path;
    div.appendChild(repo);
    const restart = document.createElement('button');
    restart.textContent = '重启';
    restart.className = 'restart-btn';
    restart.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm(`重启项目 ${pr.id}？未完成的 inbox/timer 会被保留或清理到一致状态。`)) return;
      const { status, json } = await api(`/api/team/projects/restart?id=${encodeURIComponent(pr.id)}`, { method: 'POST' });
      if (status !== 200) alert('重启失败: ' + (json.error || status));
      await loadProjects();
      await loadPulse();
    };
    div.appendChild(restart);
    const del = document.createElement('button');
    del.textContent = '删除';
    del.className = 'del-btn';
    del.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm(`删除项目 ${pr.id}？（issue 与团队记忆保留在磁盘）`)) return;
      await api(`/api/team/projects?id=${encodeURIComponent(pr.id)}`, { method: 'DELETE' });
      if (current === pr.id) current = null;
      await loadProjects();
    };
    div.appendChild(del);
    div.onclick = () => selectProject(pr.id);
    list.appendChild(div);
  }
}

function selectProject(id) {
  current = id;
  renderProjects();
  loadIssues();
  loadPulse();
}

async function loadProjects() {
  const { json } = await api('/api/team/projects');
  projects = json.projects || [];
  if (current && !projects.some((p) => p.id === current)) current = null;
  renderProjects();
  if (current) loadIssues();
}

async function loadIssues() {
  const box = $('issue-list');
  if (!current) { box.innerHTML = '<p class="empty">选择项目后加载。</p>'; return; }
  const { json } = await api(`/api/team/issues?project=${encodeURIComponent(current)}`);
  const issues = json.issues || [];
  box.textContent = '';
  const groups = { pending: [], confirmed: [], rejected: [], done: [] };
  for (const i of issues) (groups[i.status] || groups.done).push(i);
  for (const [status, items] of Object.entries(groups)) {
    if (!items.length) continue;
    const g = document.createElement('div');
    g.className = 'issue-group';
    const h = document.createElement('h3');
    h.textContent = status;
    g.appendChild(h);
    for (const i of items) {
      const row = document.createElement('div');
      row.className = 'issue';
      const left = document.createElement('div');
      left.innerHTML = `<div class="title"></div><div class="meta"></div>`;
      left.querySelector('.title').textContent = `${i.id} · ${i.title}`;
      left.querySelector('.meta').textContent = `${i.source} · ${i.created.slice(0, 16).replace('T', ' ')}`;
      row.appendChild(left);
      if (status === 'pending') {
        const actions = document.createElement('div');
        actions.className = 'actions';
        const ok = document.createElement('button');
        ok.textContent = '确认';
        ok.onclick = () => actIssue(i.id, 'confirm');
        const no = document.createElement('button');
        no.textContent = '驳回';
        no.className = 'reject';
        no.onclick = () => actIssue(i.id, 'reject');
        actions.append(ok, no);
        row.appendChild(actions);
      }
      g.appendChild(row);
    }
    box.appendChild(g);
  }
  if (!box.children.length) box.innerHTML = '<p class="empty">没有 issue。</p>';
}

async function actIssue(id, action) {
  const { status, json } = await api(`/api/team/issue/${id}/${action}`, { method: 'POST' });
  if (status !== 200) {
    appendMsg('system', `操作失败: ${json.error || status}`);
  }
  await loadIssues();
  await loadProjects();
}

// 成员错误横幅：面板任何 tab 都能看到（动态 tab 常驻 + 对话 tab 系统行）。
function showErrorBanner(agent, text) {
  const banner = $('error-banner');
  if (banner) {
    banner.style.display = 'block';
    banner.innerHTML = '';
    const b = document.createElement('strong');
    b.textContent = agent + ' 出错：';
    banner.appendChild(b);
    banner.appendChild(document.createTextNode(text));
  }
}

const RECOVERY_REASONS = {
  invalid_spec: '配置无效',
  workspace_unauthorized: '工作区未授权',
  workspace_check: '工作区检查失败',
  team_create: '团队创建失败',
};

async function loadStartupRecovery() {
  const banner = $('recovery-banner');
  if (!banner) return;
  const { status, json } = await api('/api/team/startup');
  const recovery = json?.recovery;
  if (status !== 200 || !recovery || recovery.status !== 'degraded') {
    banner.style.display = 'none';
    banner.innerHTML = '';
    return;
  }

  banner.style.display = 'block';
  banner.innerHTML = '';
  const title = document.createElement('strong');
  title.textContent = `启动降级：已恢复 ${recovery.restored_teams}/${recovery.persisted_teams} 个团队。`;
  banner.appendChild(title);
  if (recovery.failed_teams?.length) {
    const list = document.createElement('ul');
    for (const failure of recovery.failed_teams) {
      const item = document.createElement('li');
      const reason = RECOVERY_REASONS[failure.reason] || '恢复失败';
      item.textContent = `${failure.team_id}: ${reason} — ${failure.detail}`;
      list.appendChild(item);
    }
    banner.appendChild(list);
  }
}

function appendMsg(from, text) {
  const log = $('op-stream');
  const div = document.createElement('div');
  div.className = 'msg' + (from === 'you' ? ' operator' : '');
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = from === 'you' ? '你' : from;
  div.appendChild(meta);
  div.appendChild(document.createTextNode(text));
  log.appendChild(div);
  log.parentElement.scrollTop = log.parentElement.scrollHeight;
}

// 中列发送：发给当前选中的成员（无选中则不显示输入行）。
async function sendToSelected() {
  const input = $('h-input');
  const text = input.value.trim();
  if (!text || !current || !selectedAgent) return;
  const target = selectedAgent;
  input.value = '';
  appendOp('you → ' + target, text);
  const { status, json } = await api('/api/team/chat', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ project: current, target, text }),
  });
  if (status !== 202) appendOp('system', `发送失败: ${json.error || status}`);
  setTimeout(loadAgentHistory, 400);
}

// operator 消息流（原对话 log，合并进动态 tab）
function appendOp(from, text) {
  const log = $('op-stream');
  const div = document.createElement('div');
  div.className = 'item';
  div.innerHTML = '<span class="meta"></span><div class="body"></div>';
  div.querySelector('.meta').textContent = from;
  div.querySelector('.body').textContent = text;
  if (log.querySelector('.empty')) log.textContent = '';
  log.prepend(div);
  while (log.children.length > 50) log.removeChild(log.lastChild);
}

$('register-form').onsubmit = async (e) => {
  e.preventDefault();
  const { status, json } = await api('/api/team/projects', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ id: $('reg-id').value.trim(), repo_path: $('reg-path').value.trim() }),
  });
  if (status !== 201) {
    alert(`注册失败: ${json.error || status}`);
    return;
  }
  $('reg-id').value = '';
  $('reg-path').value = '';
  await loadProjects();
};


// ── Directory picker (browse server-side, fill absolute path) ──
let dirCursor = '';
async function openDirPicker() {
  $('dir-modal').classList.add('open');
  await loadWorkspaceGrants();
}
function closeDirPicker() {
  $('dir-modal').classList.remove('open');
}

async function loadWorkspaceGrants() {
  const { json } = await api('/api/team/fs/grants');
  const list = $('grant-list');
  list.textContent = '';
  for (const grant of (json.grants || [])) {
    const item = document.createElement('div');
    item.className = 'grant-item';
    const label = document.createElement('span');
    label.textContent = grant.path;
    label.title = grant.path;
    const remove = document.createElement('button');
    remove.className = 'grant-remove';
    remove.textContent = '撤销';
    remove.onclick = async () => {
      const { status } = await api(`/api/team/fs/grants?id=${encodeURIComponent(grant.id)}`, { method: 'DELETE' });
      if (status === 200) await loadWorkspaceGrants();
    };
    item.append(label, remove);
    list.appendChild(item);
  }
  if (json.grants?.length) await browseDir(json.grants[0].path);
  else {
    dirCursor = '';
    $('dir-crumbs').textContent = '尚无授权工作区';
    const list = $('dir-list');
    list.textContent = '';
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.style.padding = '.5rem .75rem';
    empty.textContent = '输入一个绝对路径并点击“授权”后才能浏览。';
    list.appendChild(empty);
  }
}

$('grant-add').onclick = async () => {
  const path = $('grant-path').value.trim();
  if (!path) return;
  const { status, json } = await api('/api/team/fs/grants', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ path }),
  });
  if (status !== 201) {
    alert(`授权失败: ${json.error || status}`);
    return;
  }
  $('grant-path').value = '';
  await loadWorkspaceGrants();
};
async function browseDir(path) {
  const { status, json } = await api(`/api/team/fs?path=${encodeURIComponent(path)}`);
  if (status !== 200) {
    alert(`无法读取目录: ${json.error || status}`);
    return;
  }
  dirCursor = json.path;
  $('dir-crumbs').textContent = json.path + (json.is_repo ? '  [git 仓库]' : '');
  const list = $('dir-list');
  list.textContent = '';
  if (!json.dirs.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.style.padding = '.5rem .75rem';
    p.textContent = '（无子目录）';
    list.appendChild(p);
  }
  for (const d of json.dirs) {
    const item = document.createElement('div');
    item.className = 'dir-item';
    item.textContent = d.name + '/';
    // Peek: mark repos so the user can see them at a glance.
    api(`/api/team/fs?path=${encodeURIComponent(json.path + '/' + d.name)}`)
      .then(({ json: sub }) => {
        if (sub && sub.is_repo) {
          const tag = document.createElement('span');
          tag.className = 'repo-tag';
          tag.textContent = 'git 仓库';
          item.appendChild(tag);
        }
      });
    item.onclick = () => browseDir(json.path + '/' + d.name);
    list.appendChild(item);
  }
}
$('browse-btn').onclick = openDirPicker;
$('dir-cancel').onclick = closeDirPicker;
$('dir-up').onclick = () => {
  if (dirCursor && dirCursor !== '/') {
    browseDir(dirCursor.replace(/\/[^/]*$/, '') || '/');
  }
};
$('dir-select').onclick = () => {
  $('reg-path').value = dirCursor;
  if (!$('reg-id').value.trim()) {
    $('reg-id').value = dirCursor.split('/').filter(Boolean).pop() || '';
  }
  closeDirPicker();
};
// Click outside the dialog closes it.
$('dir-modal').onclick = (e) => {
  if (e.target === $('dir-modal')) closeDirPicker();
};
document.querySelectorAll('.tab').forEach((t) => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active'));
    document.querySelectorAll('section').forEach((x) => x.classList.remove('active'));
    t.classList.add('active');
    $(`tab-${t.dataset.tab}`).classList.add('active');
    if (t.dataset.tab === 'pulse') loadPulse();
  };
});

// ── Pulse: per-agent situation cards with inject/abort controls ──
let selectedAgent = null;

async function loadPulse() {
  if (!current) {
    $('col-members').innerHTML = '<p class="empty">选择项目后加载。</p>';
    $('col-history').innerHTML = '';
    $('col-config').innerHTML = '';
    $('pulse-pending').innerHTML = '<p class="empty">—</p>';
    $('pulse-issues').innerHTML = '<p class="empty">—</p>';
    $('pulse-timers').innerHTML = '<p class="empty">—</p>';
    return;
  }
  const { status, json } = await api(`/api/team/pulse?project=${encodeURIComponent(current)}`);
  if (status !== 200) return;
  renderMembers(json.agents || []);
  if (selectedAgent) {
    loadAgentHistory();
    if (!$('col-config').dataset.loaded) loadAgentConfig();
  }
  const pending = $('pulse-pending');
  pending.textContent = '';
  const items = json.pending || [];
  if (!items.length) pending.innerHTML = '<p class="empty">无待处理消息</p>';
  for (const m of items.slice(0, 10)) {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = '<span class="meta"></span><div class="body"></div>';
    div.querySelector('.meta').textContent = `${m.from} → ${m.to} · ${m.type}`;
    div.querySelector('.body').textContent = m.body.length > 140 ? m.body.slice(0, 140) + '…' : m.body;
    pending.appendChild(div);
  }
  const iss = json.issues || {};
  $('pulse-issues').innerHTML =
    `<div class="item"><span class="meta">待确认 ${iss.pending ?? 0} · 已确认 ${iss.confirmed ?? 0}</span></div>`;
  const timers = json.timers || {};
  $('pulse-timers').innerHTML =
    `<div class="item"><span class="meta">活跃定时器 ${timers.pending ?? 0}</span></div>`;
}

// ── 左列：成员卡片 ──
function renderMembers(agents) {
  const col = $('col-members');
  col.textContent = '';
  for (const a of agents) {
    const card = document.createElement('div');
    card.className = 'member-card' + (a.id === selectedAgent ? ' selected' : '');
    card.onclick = () => { selectedAgent = a.id; $('col-config').dataset.loaded = ''; loadPulse(); };
    const who = document.createElement('div');
    who.className = 'who';
    who.innerHTML = '<div class="name"></div><div class="meta"></div>';
    who.querySelector('.name').textContent = a.id;
    who.querySelector('.meta').textContent =
      a.status + (a.phase ? ` · ${a.phase}` : '') + (a.activity && a.activity.task ? ` · ${a.activity.task.slice(0, 40)}` : '');
    card.appendChild(who);
    // busy 时显示运行中工具
    if (a.status === 'busy' && a.activity && (a.activity.tools || []).length) {
      const tl = document.createElement('div');
      tl.className = 'meta';
      tl.textContent = '⚙ ' + a.activity.tools.join(', ');
      card.appendChild(tl);
    }
    // 错误常显：用户不该去猜 agent 为什么没输出
    if (a.error) {
      const el = document.createElement('div');
      el.className = 'err-line';
      el.textContent = '⚠ ' + (a.error.length > 80 ? a.error.slice(0, 80) + '…' : a.error);
      card.appendChild(el);
    }
    // 插话/停止
    if (a.status !== 'stopped') {
      const ctrl = document.createElement('div');
      ctrl.className = 'ctrl';
      const qs = `project=${encodeURIComponent(current)}&agent=${encodeURIComponent(a.id)}`;
      const inject = document.createElement('button');
      inject.textContent = '插话';
      inject.onclick = (e) => {
        e.stopPropagation();
        const text = prompt(`给 ${a.id} 插话：`);
        if (!text) return;
        api(`/api/team/agent/inject?${qs}`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ text }),
        });
      };
      const stop = document.createElement('button');
      stop.textContent = '停止';
      stop.className = 'stop';
      stop.onclick = async (e) => {
        e.stopPropagation();
        if (!confirm(`停止 ${a.id} 当前执行？`)) return;
        await api(`/api/team/agent/abort?${qs}`, { method: 'POST' });
        setTimeout(loadPulse, 800);
      };
      ctrl.append(inject, stop);
      card.appendChild(ctrl);
    }
    col.appendChild(card);
  }
}

// ── 中列：session 历史（选中成员即对话对象）──
async function loadAgentHistory() {
  if (!current || !selectedAgent) return;
  const col = $('col-history');

  // 表单无条件先建（会话为空也要能发第一条消息）；
  // 切换成员时整体重建，避免残留上一个成员的表单状态。
  col.innerHTML = '';
  const head = document.createElement('h3');
  head.style.cssText = 'margin:.1rem 0 .5rem;font-size:.85rem';
  head.textContent = selectedAgent + ' 会话';
  col.appendChild(head);

  const form = document.createElement('div');
  form.id = 'h-form';
  form.style.cssText = 'display:flex;gap:.4rem;margin:0 0 .6rem';
  const ta = document.createElement('textarea');
  ta.id = 'h-input';
  ta.placeholder = '给 ' + selectedAgent + ' 发任务…（Ctrl+Enter 发送）';
  ta.style.cssText = 'flex:1;min-height:2.2rem;font:inherit;padding:.4rem;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);resize:vertical';
  const btn = document.createElement('button');
  btn.id = 'h-send';
  btn.textContent = '发送';
  btn.onclick = sendToSelected;
  ta.onkeydown = (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); sendToSelected(); }
  };
  form.append(ta, btn);
  col.appendChild(form);

  const lines_box = document.createElement('div');
  lines_box.id = 'h-lines';
  col.appendChild(lines_box);

  // 拉会话；空/失败只影响 lines_box 的占位，不影响输入框
  const qs = `project=${encodeURIComponent(current)}&agent=${encodeURIComponent(selectedAgent)}`;
  const { status, json } = await api(`/api/team/agent/session?${qs}`);
  const lines = status === 200 ? (json.lines || []) : [];
  if (status !== 200) {
    lines_box.innerHTML = '<p class="empty">会话为空（首轮运行后生成）。直接在上面输入即可开始。</p>';
    return;
  }
  for (const l of lines) {
    const div = document.createElement('div');
    div.className = 'h-line ' + (l.kind === 'user' ? 'user' : l.kind === 'tool_result' ? 'tool' : '');
    let text = l.text || '';
    if (l.tools && l.tools.length) text += ' ⚙' + l.tools.join(',');
    div.textContent = (l.kind === 'user' ? '» ' : '') + (text.length > 300 ? text.slice(0, 300) + '…' : text);
    lines_box.appendChild(div);
  }
  col.scrollTop = col.scrollHeight;
}

// ── 右列：per-agent 配置 ──
async function loadAgentConfig() {
  if (!current || !selectedAgent) return;
  const qs = `project=${encodeURIComponent(current)}&agent=${encodeURIComponent(selectedAgent)}`;
  const { status, json } = await api(`/api/team/agent/config?${qs}`);
  const col = $('col-config');
  if (status !== 200) {
    col.innerHTML = '<p class="empty">配置加载失败。</p>';
    return;
  }
  const tools = json.tools || [];
  const hasFs = tools.some(t => ['bash','read','write','edit'].includes(t));
  const hasWeb = tools.some(t => t === 'web_search' || t === 'web_fetch');
  const model = json.model || '';
  const isTier = ['strong','main','cheap'].includes(model);
  col.innerHTML = `<h3 style="margin:.1rem 0 .5rem;font-size:.85rem">配置 · ${selectedAgent}</h3>
    <div class="row"><label>模型</label>
      <select id="cfg-tier">
        <option value="">（显式）</option>
        <option value="strong">强 strong</option>
        <option value="main">主 main</option>
        <option value="cheap">省 cheap</option>
      </select>
      <input id="cfg-explicit" placeholder="显式 model id">
    </div>
    <div class="row"><label>API Key</label><input id="cfg-apikey" type="password" placeholder="${json.override && json.override.api_key_set ? '已设置（输入替换）' : '继承全局'}"></div>
    <div class="row"><label>Base URL</label><input id="cfg-baseurl" placeholder="${(json.override && json.override.base_url) || '继承全局'}"></div>
    <div class="row"><label>Persona</label><textarea id="cfg-persona"></textarea></div>
    <div class="row"><label>工具包</label>
      <div class="toolkit-checks">
        <label><input type="checkbox" id="tk-fs" ${hasFs ? 'checked' : ''}>fs</label>
        <label><input type="checkbox" id="tk-web" ${hasWeb ? 'checked' : ''}>web</label>
        <label title="规划中">mcp（规划中，禁用）</label>
      </div>
    </div>
    <button id="cfg-save">保存</button>
    <p class="hint" id="cfg-hint"></p>`;
  $('cfg-tier').value = isTier ? model : '';
  $('cfg-explicit').value = isTier ? '' : model;
  $('cfg-persona').value = (json.system_prompt || '').replace(/\n---[\s\S]*$/, '');
  $('cfg-save').onclick = saveAgentConfig;
  col.dataset.loaded = '1';
}

async function saveAgentConfig() {
  const body = { project: current, agent: selectedAgent };
  const persona = $('cfg-persona').value.trim();
  if (persona) body.persona = persona;
  const toolkits = [];
  if ($('tk-fs').checked) toolkits.push('fs');
  if ($('tk-web').checked) toolkits.push('web');
  body.toolkits = toolkits;
  const tier = $('cfg-tier').value;
  const explicit = $('cfg-explicit').value.trim();
  if (tier) body.model = tier;
  else if (explicit) body.model = explicit;
  const apikey = $('cfg-apikey').value.trim();
  if (apikey) body.api_key = apikey;
  const baseurl = $('cfg-baseurl').value.trim();
  if (baseurl) body.base_url = baseurl;

  const { status, json } = await api('/api/team/agent/config', {
    method: 'PUT',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body),
  });
  const hint = $('cfg-hint');
  if (status === 200) {
    hint.textContent = json.rebuilt ? '已保存（模型已重建，运行中上下文重置）' : '已保存（热生效）';
    $('col-config').dataset.loaded = '';
    setTimeout(loadPulse, 300);
  } else {
    hint.textContent = '保存失败: ' + (json.error || status);
  }
}

// ── 全局设置模态框 ──
async function openGlobalSettings() {
  const { status, json } = await api('/api/team/settings');
  if (status !== 200) return;
  $('g-model-strong').value = json.models.strong || '';
  $('g-model-main').value = json.models.main || '';
  $('g-model-cheap').value = json.models.cheap || '';
  $('g-base-url').value = json.base_url || '';
  $('g-scout-interval').value = json.scout_interval_secs || 0;
  $('set-modal').classList.add('open');
}
document.addEventListener('DOMContentLoaded', () => {
  const btn = $('global-settings');
  if (btn) btn.onclick = openGlobalSettings;
  const modal = $('set-modal');
  $('g-cancel').onclick = () => modal.classList.remove('open');
  modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('open'); };
  $('g-save').onclick = async () => {
    const { status, json } = await api('/api/team/settings', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        strong: $('g-model-strong').value.trim(),
        api_key: $('g-apikey').value.trim(),
        main: $('g-model-main').value.trim(),
        cheap: $('g-model-cheap').value.trim(),
        base_url: $('g-base-url').value.trim(),
        scout_interval_secs: parseInt($('g-scout-interval').value) || 0,
      }),
    });
    if (status === 200) modal.classList.remove('open');
    else alert('保存失败: ' + (json.error || status));
  };
});

// Pulse refreshes on a 5s cadence while its tab is visible.
setInterval(() => {
  if (document.querySelector('#tab-pulse.active') && current) loadPulse();
}, 5000);

// ── WS event stream: live operator messages + issue changes ──
function connectEvents() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/api/team/events?token=${encodeURIComponent(authToken)}`);
  ws.onmessage = (e) => {
    let ev;
    try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.type === 'operator_msg') {
      if (!current || ev.project === current) appendMsg(ev.from, ev.text);
    } else if (ev.type === 'agent_error') {
      if (!current || ev.project === current) showErrorBanner(ev.agent, ev.text);
    } else if (ev.type === 'issue_changed') {
      if (!current || ev.project === current) loadIssues();
    }
  };
  ws.onclose = () => setTimeout(connectEvents, 3000);
}
connectEvents();

loadProjects();
loadStartupRecovery();
setInterval(loadProjects, 15000);
</script>
