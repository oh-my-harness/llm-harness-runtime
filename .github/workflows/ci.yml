name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HTTP_PROXY: ""
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure private Git dependencies
        shell: bash
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.OH_MY_HARNESS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PRIVATE_DEPS_TOKEN:-}" ]]; then
            echo "::error title=Missing OH_MY_HARNESS_READ_TOKEN::Create a repository secret named OH_MY_HARNESS_READ_TOKEN with read access to private git dependencies such as oh-my-harness/llm-api-adapter."
            exit 1
          fi
          echo "::add-mask::${PRIVATE_DEPS_TOKEN}"
          git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install bubblewrap (Linux only)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          bubblewrap
          build-essential
          curl
          file
          libayatana-appindicator3-dev
          libdbus-1-dev
          libgtk-3-dev
          pkg-config
          libssl-dev
          libwebkit2gtk-4.1-dev
          libxdo-dev
          librsvg2-dev
          wget

      - name: Enable bwrap namespaces (Linux only)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 defaults to
          # kernel.apparmor_restrict_unprivileged_userns=1, and the restricted
          # user namespace bwrap creates lacks the netlink capability bwrap
          # needs to bring up loopback inside --unshare-all. Every sandbox then
          # dies with:
          #   bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted
          # Relax the restriction on this ephemeral runner, then prove the
          # capability so the test job fails here with a clear diagnostic
          # instead of inside unrelated sandbox tests.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --die-with-parent --new-session \
            --ro-bind-try /usr /usr \
            --ro-bind-try /bin /bin \
            --ro-bind-try /lib /lib \
            --ro-bind-try /lib64 /lib64 \
            --ro-bind-try /sbin /sbin \
            --proc /proc --dev /dev --tmpfs /tmp \
            -- /usr/bin/env -i PATH=/usr/bin:/bin true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --exclude llm-harness-live-tests

      - name: Run bwrap sandbox isolation tests (Linux only)
        if: runner.os == 'Linux'
        run: cargo test -p llm-harness-sandbox --features bwrap -- --include-ignored

      - name: Run seatbelt sandbox isolation tests (macOS only)
        if: runner.os == 'macOS'
        run: cargo test -p llm-harness-sandbox --features seatbelt -- seatbelt_tests
