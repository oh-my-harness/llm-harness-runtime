name: FFI SDK Wheels

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/production-ffi-sdk
    paths:
      - ".github/workflows/ffi-sdk-wheels.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/smoke_ffi_sdk_wheel.py"
  pull_request:
    paths:
      - ".github/workflows/ffi-sdk-wheels.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/smoke_ffi_sdk_wheel.py"

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  EXPECTED_FFI_ABI: "2"
  SDK_DIR: crates/llm-harness-ffi/sdk-python

defaults:
  run:
    shell: pwsh

jobs:
  checks:
    name: Rust/Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure private Git dependencies
        env:
          OH_MY_HARNESS_READ_TOKEN: ${{ secrets.OH_MY_HARNESS_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OH_MY_HARNESS_READ_TOKEN)) {
            Write-Error "Set repository or organization secret OH_MY_HARNESS_READ_TOKEN with read access to private oh-my-harness dependencies."
            exit 1
          }
          git config --global "url.https://x-access-token:$($env:OH_MY_HARNESS_READ_TOKEN)@github.com/.insteadOf" "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cffi pytest

      - name: Fetch dependencies
        run: cargo fetch

      - name: Rust format
        run: cargo fmt -p llm-harness-ffi -- --check

      - name: Rust clippy
        run: cargo clippy -p llm-harness-ffi --all-targets -- -D warnings

      - name: Rust release tests
        run: cargo test -p llm-harness-ffi --release

      - name: Build native library for Python tests
        run: cargo build -p llm-harness-ffi --release

      - name: Python SDK tests
        working-directory: ${{ env.SDK_DIR }}
        run: python -m pytest tests/test_sdk.py tests/test_provider_e2e.py tests/test_provider_stress.py

  wheels:
    name: Wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: linux-x64
            os: ubuntu-latest
          - platform: macos-x64
            os: macos-13
          - platform: macos-arm64
            os: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure private Git dependencies
        env:
          OH_MY_HARNESS_READ_TOKEN: ${{ secrets.OH_MY_HARNESS_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OH_MY_HARNESS_READ_TOKEN)) {
            Write-Error "Set repository or organization secret OH_MY_HARNESS_READ_TOKEN with read access to private oh-my-harness dependencies."
            exit 1
          }
          git config --global "url.https://x-access-token:$($env:OH_MY_HARNESS_READ_TOKEN)@github.com/.insteadOf" "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install wheel build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build cffi wheel

      - name: Build native library
        run: cargo build -p llm-harness-ffi --release

      - name: Build wheel
        working-directory: ${{ env.SDK_DIR }}
        run: python -m build --wheel --no-isolation

      - name: Smoke test installed wheel
        run: |
          $wheel = Get-ChildItem "$env:SDK_DIR/dist/*.whl" | Select-Object -First 1
          if ($null -eq $wheel) {
            Write-Error "No wheel found under $env:SDK_DIR/dist"
            exit 1
          }
          python scripts/smoke_ffi_sdk_wheel.py $wheel.FullName --expected-abi $env:EXPECTED_FFI_ABI

      - name: Prepare artifacts
        run: |
          $artifactDir = Join-Path "artifacts" "ffi-sdk-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force $artifactDir | Out-Null
          Copy-Item "$env:SDK_DIR/dist/*.whl" $artifactDir
          Get-ChildItem $artifactDir -Filter "*.whl" | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffi-sdk-${{ matrix.platform }}
          path: artifacts/ffi-sdk-${{ matrix.platform }}/*
          if-no-files-found: error
