name: Build Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon
          - os: macos-14
            target: aarch64-apple-darwin
            py: "3.12"
          # macOS — Intel
          - os: macos-13
            target: x86_64-apple-darwin
            py: "3.12"
          # Linux x64 — manylinux
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            py: "3.12"
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            py: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install maturin
        run: pip install maturin>=1.5

      - name: Build wheel
        working-directory: crates/llm-harness-py
        run: maturin build --release --target ${{ matrix.target }} --interpreter python${{ matrix.py }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: crates/llm-harness-py/target/wheels/*.whl
          if-no-files-found: error

  release:
    name: Publish wheels to release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wheels/*.whl
          generate_release_notes: true
